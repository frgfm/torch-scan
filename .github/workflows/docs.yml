name: docs
on:
  push:
    branches: main
  pull_request:
    branches: main

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_TORCH_BACKEND: cpu

jobs:
  docs:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          activate-environment: true
      - name: Install dependencies
        run: make install-docs
      - name: Build documentation
        run: make build-docs
      - name: Documentation sanity check
        run: |
          test -e docs/site/index.html
          test -e docs/site/installing.html
          test -e docs/site/model-support.html
          test -e docs/site/metrics.html
          test -e docs/site/torchscan.html
          test -e docs/site/modules.html
          test -e docs/site/process.html
          test -e docs/site/utils.html
          test -e docs/site/changelog.html
          test -e docs/site/latest/changelog.html
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    if: github.event_name == 'push'
    needs: docs
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
