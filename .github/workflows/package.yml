name: package

on:
  push:
    branches: main
  pull_request:
    branches: [main, "codex/**"]
  release:
    types: [published]

env:
  UV_TORCH_BACKEND: cpu

jobs:
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: uv pip install -e .
      - name: Import package
        run: python -c "import torchscan; print(torchscan.__version__)"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install dependencies
        run: make install-quality
      - name: Run quality checks
        env:
          SKIP: no-commit-to-branch,ruff-check,ruff-format,ty,lmh
        run: |
          make quality
          make precommit

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install dependencies
        run: make install-test
      - name: Run tests
        run: make test
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: true

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            python: "3.11"
            torch: torch==2.1.0
          - name: latest
            python: "3.14"
            torch: torch>=2.1.0,<3.0.0
    name: compatibility (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
      - name: Install compatibility environment
        run: |
          if [[ "${{ matrix.name }}" == "minimum" ]]; then
            uv pip install -e ".[test]" "${{ matrix.torch }}" "setuptools<70" "numpy<2"
          else
            uv pip install -e ".[test]" "${{ matrix.torch }}"
          fi
      - name: Run v0.2 contract tests
        run: >-
          pytest
          tests/test_benchmark.py
          tests/test_benchmark_comparison.py
          tests/test_diagnostics.py
          tests/test_compare.py
          tests/test_crawler.py
          tests/test_custom_transformer.py
          tests/test_flops.py
          tests/test_primitives.py
          tests/test_inputs.py
          tests/test_report.py
          tests/test_transformer_formulas.py
          tests/test_transformers.py
          tests/test_token_dependencies.py
          tests/test_token_consumers.py

  model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install model test dependencies
        run: uv pip install -e ".[test,model-test]"
      - name: Run no-download model smokes
        run: pytest tests/test_model_zoo.py

  headers:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check headers
        uses: frgfm/lint-my-headers@b2cbf9115943aa4b1407c3c944cc7c51250e7673 # v0.6.0

  build:
    needs: [install, quality, tests, compatibility, model-smoke, headers]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          activate-environment: "false"
      - name: Resolve package version
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          else
            VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set release version
        if: github.event_name == 'release'
        run: make set-version
      - name: Build package
        run: make build
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  verify-artifacts:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: wheel
            path: dist/*.whl
          - artifact: sdist
            path: dist/*.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Install ${{ matrix.artifact }}
        run: uv pip install ${{ matrix.path }}
      - name: Smoke-test public API
        working-directory: ${{ runner.temp }}
        run: >-
          python -c "from importlib.metadata import metadata, version;
          import torch, torchscan;
          assert version('torchscan') == '${{ needs.build.outputs.version }}';
          assert metadata('torchscan')['Name'] == 'torchscan';
          report = torchscan.crawl_module(torch.nn.Linear(4, 2), input_shape=(4,));
          assert report;
          assert callable(torchscan.summary);
          assert callable(torchscan.measure_flops);
          inputs = torch.ones(4);
          timing = torchscan.measure_latency(lambda: inputs + 1, device='cpu', inputs=inputs, min_run_time=0.01);
          assert timing['totals']['latency']['status'] == 'complete';
          comparison = torchscan.compare_benchmarks(timing, timing, check=lambda: True);
          assert 'Output check passed' in torchscan.render_report(comparison);
          assert callable(torchscan.compare_reports);
          assert callable(torchscan.process.measure_peak_memory)"

  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: [build, verify-artifacts]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          activate-environment: "false"
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Publish verified distributions
        run: uv publish --trusted-publishing always dist/*

  verify-publish:
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
      - name: Install released package
        working-directory: ${{ runner.temp }}
        run: uv pip install "torchscan==${{ needs.publish.outputs.version }}"
      - name: Verify released package
        working-directory: ${{ runner.temp }}
        run: >-
          python -c "from importlib.metadata import metadata, version;
          import torch, torchscan;
          assert torchscan.__version__ == '${{ needs.publish.outputs.version }}';
          assert version('torchscan') == '${{ needs.publish.outputs.version }}';
          assert metadata('torchscan')['Name'] == 'torchscan';
          assert torchscan.crawl_module(torch.nn.Linear(4, 2), input_shape=(4,))"
