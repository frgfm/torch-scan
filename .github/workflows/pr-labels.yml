name: pr-labels

on:
  pull_request_target:
    branches: main
    types: [closed]

jobs:
  is-properly-labeled:
    if: github.event.pull_request.merged == true
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Check labels and comment
        uses: actions/github-script@v9
        with:
          script: |
            const primaryLabels = new Set([
              "type: new feature",
              "type: bug",
              "type: enhancement",
              "type: misc",
            ]);
            const secondaryLabels = new Set([
              "topic: documentation",
              "module: modules",
              "module: process",
              "module: crawler",
              "module: utils",
              "ext: docs",
              "ext: scripts",
              "ext: tests",
              "topic: build",
              "topic: ci",
            ]);
            const pullRequest = context.payload.pull_request;
            const labelNames = pullRequest.labels.map(({ name }) => name);
            const hasPrimary = labelNames.some((name) => primaryLabels.has(name));
            const hasSecondary = labelNames.some((name) => secondaryLabels.has(name));

            if (!pullRequest.merged || (hasPrimary && hasSecondary)) {
              return;
            }

            const merger = pullRequest.merged_by?.login;
            const intro = merger ? `Hey @${merger} 👋\nYou merged this PR, but it` : "This merged PR";
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: pullRequest.number,
              body: `${intro} is not correctly labeled. The list of valid labels is available at https://github.com/frgfm/torch-scan/blob/main/.github/workflows/pr-labels.yml`,
            });
