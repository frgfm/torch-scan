name: pr-labels

on:
  pull_request:
    branches: main
    types: closed

jobs:
  is-properly-labeled:
    if: github.event.pull_request.merged == true
    permissions:
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install requests
        run: uv pip install --system requests
      - name: Process commit and find merger responsible for labeling
        id: commit
        run: echo "merger=$(python .github/verify_labels.py ${{ github.event.pull_request.number }})" >> "$GITHUB_OUTPUT"
      - name: Comment PR
        uses: actions/github-script@v9
        if: ${{ steps.commit.outputs.merger != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { issue: { number: issue_number }, repo: { owner, repo }  } = context;
            github.rest.issues.createComment({ issue_number, owner, repo, body: 'Hey ${{ steps.commit.outputs.merger }} 👋\nYou merged this PR, but it is not correctly labeled. The list of valid labels is available at https://github.com/frgfm/torch-scan/blob/main/.github/verify_labels.py' });
